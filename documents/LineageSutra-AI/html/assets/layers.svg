<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-label="Architecture layers and implementation state"><title>Architecture layers and implementation state</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}

text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="820" height="370" rx="14"/><text class="h" x="30" y="30">Five layers, built from the inside out</text><rect class="card" x="30" y="56" width="760" height="50" rx="10"/><text class="b" x="48" y="78">E  Hosted dashboard + server</text><text class="s" x="48" y="96">not started</text><rect class="ok" x="48" y="116" width="724" height="50" rx="10"/><text class="b" x="66" y="138">D  Hosts: CLI, Node API, MCP, loopback HTTP, skill installer</text><text class="s" x="66" y="156">implemented</text><rect class="warn" x="66" y="176" width="688" height="50" rx="10"/><text class="b" x="84" y="198">C  Agent Skills: 25 skills, 20 role files</text><text class="s" x="84" y="216">authored, host activation untested</text><rect class="warn" x="84" y="236" width="652" height="50" rx="10"/><text class="b" x="102" y="258">B  Adapters: dbt manifest (done), SQLGlot / OpenLineage (planned)</text><text class="s" x="102" y="276">partly implemented</text><rect class="ok" x="102" y="296" width="616" height="50" rx="10"/><text class="b" x="120" y="318">A  Trusted local core: tokenizer, parser, scan, impact, seal</text><text class="s" x="120" y="336">implemented, tested</text></svg>