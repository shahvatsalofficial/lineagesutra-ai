<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 602" role="img" aria-label="Gold corpus accuracy by tag"><title>Gold corpus accuracy by tag</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}
