<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-label="CI gate flow for breaking schema changes"><title>CI gate flow for breaking schema changes</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#16212d;--ink:#e6edf5;--mute:#9db0c3;--line:#2c3d50;--brand:#6ea3ff;--ok:#6fdc9a;--okbg:#10301f;--warn:#f1c460;--warnbg:#33290f;--bad:#ff8f87;--badbg:#3a1714;--info:#8db8ff;--infobg:#11264a}}
text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="1000" height="310" rx="14"/><text class="h" x="30" y="30">Breaking-change gate in a pull request</text><rect class="info" x="30" y="60" width="170" height="60" rx="10"/><text class="c b" x="115" y="85.5">Pull request</text><text class="c s" x="115" y="102.5">changes .sql files</text><path class="ln" d="M200,90 L240,90" marker-end="url(#a)"/><rect class="card" x="240" y="60" width="170" height="60" rx="10"/><text class="c b" x="325" y="85.5">scan --strict</text><text class="c s" x="325" y="102.5">new graph</text><path class="ln" d="M410,90 L450,90" marker-end="url(#a)"/><rect class="card" x="450" y="60" width="170" height="60" rx="10"/><text class="c b" x="535" y="85.5">compare</text><text class="c s" x="535" y="102.5">baseline vs new</text><path class="ln" d="M620,90 L670,90" marker-end="url(#a)"/><rect class="card" x="670" y="60" width="230" height="60" rx="10"/><text class="c b" x="785" y="85.5">--fail-on-breaking</text><text class="c s" x="785" y="102.5">any consumer lost a column?</text><text class="s" x="690" y="148">yes (exit 3)</text><path class="ln" d="M740,120 L740,170" marker-end="url(#a)"/><rect class="bad" x="640" y="170" width="260" height="64" rx="10"/><text class="c b" x="770" y="197.5">Job fails</text><text class="c s" x="770" y="214.5">drift.html lists every consumer</text><text class="s" x="920" y="148">no (exit 0)</text><path class="ln" d="M880,120 L880,150 L930,150 L930,260 L520,260" /><rect class="ok" x="300" y="236" width="220" height="48" rx="10"/><text class="c b" x="410" y="255.5">Merge allowed</text><text class="c s" x="410" y="272.5">reviewers can still read drift.html</text></svg>