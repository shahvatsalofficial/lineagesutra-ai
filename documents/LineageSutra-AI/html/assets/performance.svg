<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Performance versus budget"><title>Performance versus budget</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#16212d;--ink:#e6edf5;--mute:#9db0c3;--line:#2c3d50;--brand:#6ea3ff;--ok:#6fdc9a;--okbg:#10301f;--warn:#f1c460;--warnbg:#33290f;--bad:#ff8f87;--badbg:#3a1714;--info:#8db8ff;--infobg:#11264a}}
text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="900" height="200" rx="14"/><text class="h" x="30" y="30">Measured speed vs. budget (median, this machine, synthetic data)</text><text x="30" y="68">Scan: 2,000 chained views</text><rect class="card" x="30" y="78" width="560" height="22" rx="6"/><rect class="ok" x="30" y="78" width="13.216" height="22" rx="6"/><text class="s" x="602" y="94">708 ms of 30000 ms budget</text><text x="30" y="132">Impact: 20,000-dataset graph</text><rect class="card" x="30" y="142" width="560" height="22" rx="6"/><rect class="ok" x="30" y="142" width="121.52" height="22" rx="6"/><text class="s" x="602" y="158">1085 ms of 5000 ms budget</text></svg>