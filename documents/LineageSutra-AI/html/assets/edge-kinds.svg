<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-label="Direct, derived and indirect dependency kinds with examples"><title>Direct, derived and indirect dependency kinds with examples</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}

text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="980" height="250" rx="14"/><text class="h" x="30" y="30">Three kinds of dependency</text><rect class="ok" x="30" y="56" width="296" height="170" rx="12"/><text class="b" x="46" y="82" style="font-size:16px">direct</text><text class="mono" x="46" y="110">SELECT email FROM customers</text><text class="mono b" x="46" y="140">customers.email  =&gt;  v.email</text><text class="s" x="46" y="170">Plain copy. Rename or drop breaks it. </text><rect class="info" x="350" y="56" width="296" height="170" rx="12"/><text class="b" x="366" y="82" style="font-size:16px">derived</text><text class="mono" x="366" y="110">SELECT upper(email) AS e FROM custo...</text><text class="mono b" x="366" y="140">customers.email  =&gt;  v.e</text><text class="s" x="366" y="170">Expression, aggregate, window or </text><text class="s" x="366" y="186">subquery. The value changes if the </text><text class="s" x="366" y="202">input changes. </text><rect class="warn" x="670" y="56" width="296" height="170" rx="12"/><text class="b" x="686" y="82" style="font-size:16px">indirect</text><text class="mono" x="686" y="110">SELECT id FROM customers WHERE emai...</text><text class="mono b" x="686" y="140">customers.email  ~&gt;  v (dataset)</text><text class="s" x="686" y="170">Decides which rows exist, or how they </text><text class="s" x="686" y="186">group and order. Reported as possible. </text></svg>