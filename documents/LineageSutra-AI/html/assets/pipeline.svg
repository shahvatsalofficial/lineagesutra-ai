<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-label="Pipeline from SQL files to sealed graph, analyses and reports"><title>Pipeline from SQL files to sealed graph, analyses and reports</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}

text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="980" height="410" rx="14"/><text class="h" x="30" y="30">How LineageSutra AI turns SQL into evidence</text><rect class="info" x="30" y="60" width="150" height="62" rx="10"/><text class="c b" x="105" y="86.5">SQL files</text><text class="c s" x="105" y="103.5">or dbt manifest</text><path class="ln" d="M180,91 L220,91" marker-end="url(#a)"/><rect class="card" x="220" y="60" width="150" height="62" rx="10"/><text class="c b" x="295" y="86.5">Tokenizer</text><text class="c s" x="295" y="103.5">comments dropped</text><path class="ln" d="M370,91 L410,91" marker-end="url(#a)"/><rect class="card" x="410" y="60" width="150" height="62" rx="10"/><text class="c b" x="485" y="86.5">Parser</text><text class="c s" x="485" y="103.5">queries, joins, CTEs</text><path class="ln" d="M560,91 L600,91" marker-end="url(#a)"/><rect class="card" x="600" y="60" width="150" height="62" rx="10"/><text class="c b" x="675" y="86.5">Scan</text><text class="c s" x="675" y="103.5">cross-file schemas</text><path class="ln" d="M750,91 L790,91" marker-end="url(#a)"/><rect class="ok" x="790" y="60" width="150" height="62" rx="10"/><text class="c b" x="865" y="86.5">Sealed graph</text><text class="c s" x="865" y="103.5">SHA-256 seal</text><rect class="card" x="790" y="190" width="150" height="62" rx="10"/><text class="c b" x="865" y="216.5">impact</text><text class="c s" x="865" y="233.5">what breaks?</text><rect class="card" x="790" y="270" width="150" height="62" rx="10"/><text class="c b" x="865" y="296.5">upstream</text><text class="c s" x="865" y="313.5">where from?</text><rect class="card" x="570" y="190" width="150" height="62" rx="10"/><text class="c b" x="645" y="216.5">compare</text><text class="c s" x="645" y="233.5">drift in CI</text><rect class="card" x="570" y="270" width="150" height="62" rx="10"/><text class="c b" x="645" y="296.5">contract</text><text class="c s" x="645" y="313.5">declared rules</text><path class="ln" d="M865,122 L865,150 L865,190" marker-end="url(#a)"/><path class="ln" d="M865,150 L645,150 L645,190" marker-end="url(#a)"/><rect class="ok" x="250" y="190" width="250" height="62" rx="10"/><text class="c b" x="375" y="216.5">Reports</text><text class="c s" x="375" y="233.5">Markdown + HTML + JSON</text><rect class="warn" x="250" y="270" width="250" height="62" rx="10"/><text class="c b" x="375" y="296.5">Warnings</text><text class="c s" x="375" y="313.5">what it refused to guess</text><path class="ln" d="M570,221 L500,221" marker-end="url(#a)"/><path class="ln" d="M865,332 L865,360 L375,360 L375,332" marker-end="url(#a)"/><text class="s" x="30" y="392">No network. No database. No row data. Every stage is deterministic; the same files always give the same seal.</text></svg>