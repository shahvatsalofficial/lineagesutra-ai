<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 316" role="img" aria-label="Rename of customers.email breaks three consumers"><title>Rename of customers.email breaks three consumers</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}
:root{--bg:#0f1720;--card:#16212d;--ink:#e6edf5;--mute:#9db0c3;--line:#2c3d50;--brand:#6ea3ff;--ok:#6fdc9a;--okbg:#10301f;--warn:#f1c460;--warnbg:#33290f;--bad:#ff8f87;--badbg:#3a1714;--info:#8db8ff;--infobg:#11264a}
text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="930" height="316" rx="14"/><text class="h" x="30" y="30">DriftRadar: what a column rename breaks (real compare output)</text><rect class="card" x="30" y="56" width="240" height="110" rx="10"/><text class="c b" x="150" y="106.5">BEFORE  customers</text><text class="c s" x="150" y="123.5">id, email, created_at</text><path class="ln" d="M270,111 L330,111" marker-end="url(#a)"/><rect class="warn" x="330" y="56" width="260" height="110" rx="10"/><text class="c b" x="460" y="98">AFTER  customers</text><text class="c s" x="460" y="115">id, contact_email, created_at</text><text class="c s" x="460" y="132">email removed, contact_email added</text><path class="ln" d="M460,166 L460,210" marker-end="url(#a)"/><rect class="bad" x="30" y="210" width="270" height="50" rx="10"/><text class="c b" x="165" y="230.5">campaign_recipients.email</text><text class="c s" x="165" y="247.5">still reads customers.email</text><path class="lbad" d="M165,210 L460,176" opacity=".35"/><rect class="bad" x="330" y="210" width="270" height="50" rx="10"/><text class="c b" x="465" y="230.5">customers_public.email</text><text class="c s" x="465" y="247.5">still reads customers.email</text><path class="lbad" d="M465,210 L460,176" opacity=".35"/><rect class="bad" x="630" y="210" width="270" height="50" rx="10"/><text class="c b" x="765" y="230.5">email_metrics.address</text><text class="c s" x="765" y="247.5">still reads customers.email</text><path class="lbad" d="M765,210 L460,176" opacity=".35"/><text class="s" x="30" y="296">Verdict: BREAKING_CHANGES_DETECTED. With --fail-on-breaking the CI job exits 3 and lists these consumers.</text></svg>