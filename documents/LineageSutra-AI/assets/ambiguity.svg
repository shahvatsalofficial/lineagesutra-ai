<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 226" role="img" aria-label="Ambiguous column becomes a warning instead of an edge"><title>Ambiguous column becomes a warning instead of an edge</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#16212d;--ink:#e6edf5;--mute:#9db0c3;--line:#2c3d50;--brand:#6ea3ff;--ok:#6fdc9a;--okbg:#10301f;--warn:#f1c460;--warnbg:#33290f;--bad:#ff8f87;--badbg:#3a1714;--info:#8db8ff;--infobg:#11264a}}
text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="930" height="226" rx="14"/><text class="h" x="30" y="30">Unknown stays unknown: the parser refuses to guess</text><rect class="card" x="30" y="56" width="420" height="120" rx="10"/><text class="mono" x="46" y="86">CREATE VIEW v AS</text><text class="mono" x="46" y="108">SELECT id</text><text class="mono" x="46" y="130">FROM a JOIN b ON a.id = b.id;</text><text class="s" x="46" y="158">Which table does the bare "id" belong to?</text><path class="ln" d="M450,116 L520,116" marker-end="url(#a)"/><rect class="ok" x="520" y="56" width="380" height="56" rx="10"/><text class="c b" x="710" y="79.5">Recorded: join dependency</text><text class="c s" x="710" y="96.5">a.id and b.id (indirect, role: join)</text><rect class="warn" x="520" y="124" width="380" height="56" rx="10"/><text class="c b" x="710" y="147.5">Warning: column-unknown</text><text class="c s" x="710" y="164.5">no edge is invented for "id"</text><text class="s" x="30" y="206">A wrong confident edge is worse than a visible gap. Add the CREATE TABLE statements to the scanned folder and the ambiguity disappears.</text></svg>