<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="Flowchart: confirmed versus possible impact classification"><title>Flowchart: confirmed versus possible impact classification</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#c5d0da;--brand:#0b5fff;--ok:#0a7a3d;--okbg:#e3f6ea;--warn:#946000;--warnbg:#fff2d6;--bad:#b3261e;--badbg:#fde7e5;--info:#1b4f9c;--infobg:#e4eefc}
:root{--bg:#0f1720;--card:#16212d;--ink:#e6edf5;--mute:#9db0c3;--line:#2c3d50;--brand:#6ea3ff;--ok:#6fdc9a;--okbg:#10301f;--warn:#f1c460;--warnbg:#33290f;--bad:#ff8f87;--badbg:#3a1714;--info:#8db8ff;--infobg:#11264a}
text{fill:var(--ink);font:13px system-ui,Segoe UI,sans-serif}.s{font-size:11px;fill:var(--mute)}.b{font-weight:700}.h{font-size:16px;font-weight:700}.c{text-anchor:middle}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ok{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}.warn{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.5}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5}.info{fill:var(--infobg);stroke:var(--info);stroke-width:1.5}
.ln{stroke:var(--mute);stroke-width:1.6;fill:none}.lok{stroke:var(--ok);stroke-width:2.4;fill:none}.lbad{stroke:var(--bad);stroke-width:2.4;fill:none}.lwarn{stroke:var(--warn);stroke-width:2.2;fill:none;stroke-dasharray:6 4}.ld{stroke:var(--line);stroke-width:1.4;fill:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a99a8"/></marker></defs><rect class="bg" width="900" height="450" rx="14"/><text class="h" x="30" y="30">How an impact finding is classified</text><rect class="info" x="30" y="56" width="220" height="58" rx="10"/><text class="c b" x="140" y="80.5">Change column C of table T</text><text class="c s" x="140" y="97.5">rename / drop / type</text><path class="ln" d="M250,85 L310,85" marker-end="url(#a)"/><rect class="card" x="310" y="56" width="260" height="58" rx="10"/><text class="c b" x="440" y="80.5">Is C copied or computed in a</text><text class="c s" x="440" y="97.5">parsed SELECT item downstream?</text><text class="s" x="580" y="76">yes</text><path class="ln" d="M570,85 L640,85" marker-end="url(#a)"/><rect class="bad" x="640" y="56" width="220" height="58" rx="10"/><text class="c b" x="750" y="80.5">CONFIRMED (static)</text><text class="c s" x="750" y="97.5">proof path + file:line</text><text class="s" x="446" y="140">no</text><path class="ln" d="M440,114 L440,160" marker-end="url(#a)"/><rect class="card" x="310" y="160" width="260" height="58" rx="10"/><text class="c b" x="440" y="184.5">Is C used in WHERE, JOIN,</text><text class="c s" x="440" y="201.5">GROUP, HAVING or ORDER?</text><text class="s" x="580" y="180">yes</text><path class="ln" d="M570,189 L640,189" marker-end="url(#a)"/><rect class="warn" x="640" y="160" width="220" height="58" rx="10"/><text class="c b" x="750" y="184.5">POSSIBLE (indirect)</text><text class="c s" x="750" y="201.5">dataset rows may change</text><text class="s" x="446" y="244">no</text><path class="ln" d="M440,218 L440,264" marker-end="url(#a)"/><rect class="card" x="310" y="264" width="260" height="58" rx="10"/><text class="c b" x="440" y="288.5">Is a table downstream of T</text><text class="c s" x="440" y="305.5">with unparsed or unknown SQL?</text><text class="s" x="580" y="284">yes</text><path class="ln" d="M570,293 L640,293" marker-end="url(#a)"/><rect class="warn" x="640" y="264" width="220" height="58" rx="10"/><text class="c b" x="750" y="288.5">POSSIBLE (table-level)</text><text class="c s" x="750" y="305.5">check with the owner</text><text class="s" x="446" y="348">no</text><path class="ln" d="M440,322 L440,368" marker-end="url(#a)"/><rect class="ok" x="310" y="368" width="260" height="58" rx="10"/><text class="c b" x="440" y="392.5">No dependency found in the</text><text class="c s" x="440" y="409.5">supported subset - read warnings</text></svg>